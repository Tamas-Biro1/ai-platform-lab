[project]
name = "llm-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tamas-Biro1", email = "60390128+Tamas-Biro1@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.163.0",
    "openai>=3.51.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
llm-service = "llm_service:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
